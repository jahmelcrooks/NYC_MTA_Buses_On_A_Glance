name: Pebble

# Unit-tests the phone-side JS and builds the .pbw for every Pebble platform.
on:
  push:
    branches: [master]
    paths: ["pebble/**", ".github/workflows/pebble.yml"]
  pull_request:
    paths: ["pebble/**", ".github/workflows/pebble.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pebble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JS unit tests
        run: npm test
      - name: Install Pebble SDK dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0 libglib2.0-0 libpixman-1-0 zlib1g libsndio7.0
      - uses: astral-sh/setup-uv@v6
      - name: Install pebble-tool and SDK
        run: |
          uv tool install --python 3.12 pebble-tool
          yes | pebble sdk install latest
      - name: Build
        run: pebble build
      - uses: actions/upload-artifact@v4
        with:
          name: nyc-buses-pebble
          path: pebble/build/*.pbw
          if-no-files-found: error

      # Smoke test: launch in the emulator and screenshot it. The real build has no API key, so
      # it should show the "add your key" screen; a demo build (sample buses) shows the list and
      # the detail screen. Informational only, so it never fails the build.
      - name: Emulator screenshots
        continue-on-error: true
        run: |
          sudo apt-get install -y xvfb
          mkdir -p shots
          shoot() { # $1 = platform, $2 = name
            xvfb-run -a sh -c "pebble install --emulator $1 build/pebble.pbw && sleep 20 && \
              pebble screenshot --emulator $1 --no-open shots/$1-$2.png && \
              { pebble emu-button --emulator $1 click select || true; } && sleep 3 && \
              pebble screenshot --emulator $1 --no-open shots/$1-$2-select.png" || true
            pebble kill || true
          }
          for p in basalt chalk emery; do shoot $p nokey; done
          pebble clean && PEBBLE_DEMO=1 pebble build
          for p in basalt chalk emery diorite; do shoot $p demo; done
          ls -la shots
          for f in shots/*.png; do echo "SHOT $f $(base64 -w0 "$f")"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: pebble/shots/*.png
          if-no-files-found: ignore
