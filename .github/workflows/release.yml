name: Release build

# Builds the signed Play Store bundle (.aab) and a signed .apk for sideloading.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.11.
#
# Repository secrets optional (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64  the upload keystore (.jks), base64-encoded
#   RELEASE_STORE_PASSWORD   keystore password
#   RELEASE_KEY_ALIAS        key alias inside the keystore
#   RELEASE_KEY_PASSWORD     key password
#   MTA_API_KEY              your MTA Bus Time key (compiled into the app)
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # only used to attach files to a draft GitHub release on tag pushes

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_STORE_FILE: release.jks
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      MTA_API_KEY: ${{ secrets.MTA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Check secrets and restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
          else
            echo "::warning::Keystore secrets not configured in GitHub repository settings. Building release APK."
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
          fi

      - name: Test and build signed release bundle and APK
        if: env.HAS_KEYSTORE == 'true'
        run: ./gradlew --no-daemon testReleaseUnitTest bundleRelease assembleRelease

      - name: Test and build unsigned release APK
        if: env.HAS_KEYSTORE == 'false'
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Remove keystore
        if: always() && env.HAS_KEYSTORE == 'true'
        run: rm -f "$RELEASE_STORE_FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: nyc-buses-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Draft GitHub release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "NYC Buses On A Glance $GITHUB_REF_NAME" \
            --notes "Release build. Install the APK with adb; the .aab (if signed) is for the Play Store." \
            app/build/outputs/apk/release/*.apk
